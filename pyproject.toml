[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "codejudge"
version = "0.1.0"
description = "Evaluation engine for AI-generated code: sandboxed tests, hidden tests, static analysis, security scanning, benchmarking and rubric-based LLM review."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
llm = ["anthropic>=0.70"]
# Tooling needed only when running the *local* (non-Docker) sandbox backend.
local-tools = ["pytest>=8", "coverage>=7.5", "ruff>=0.6", "mypy>=1.11", "bandit>=1.7", "semgrep>=1.80"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "coverage>=7.5", "bandit>=1.7"]

[project.scripts]
codejudge = "codejudge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codejudge"]

[tool.hatch.build.targets.wheel.force-include]
"sandbox/semgrep-rules.yml" = "codejudge/sandbox/semgrep-rules.yml"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["examples", "tasks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/codejudge"]
# Harness scripts run inside the sandbox as plain scripts.
exclude = ["harness/_cj_"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["anthropic.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a running Docker daemon and the sandbox image"]
