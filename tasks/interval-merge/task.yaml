id: interval-merge
title: Merge overlapping intervals
module: solution
entrypoint: merge_intervals
description: |
  Implement two functions in `solution.py`:

  1. `merge_intervals(intervals: list[tuple[int, int]]) -> list[tuple[int, int]]`
     Merge all overlapping or touching closed intervals and return them sorted
     by start. `(1, 3)` and `(3, 5)` touch and merge into `(1, 5)`. The input
     may be unsorted and may be empty. Do not mutate the input list. Raise
     `ValueError` for an interval whose start is greater than its end.

  2. `parse_intervals(spec: str) -> list[tuple[int, int]]`
     Parse a string like `"1-3, 5-8,10-10"` into `[(1, 3), (5, 8), (10, 10)]`.
     Whitespace around items is ignored; an empty or blank string yields `[]`.
     Raise `ValueError` for malformed items.
limits:
  timeout_seconds: 30
  memory_mb: 512
  cpus: 1
tests:
  - {name: test_basic, file: tests/test_basic.py, category: correctness}
  - {name: test_hidden_correctness, file: tests/test_hidden_correctness.py, category: correctness, hidden: true}
  - {name: test_hidden_edge_cases, file: tests/test_hidden_edge_cases.py, category: edge_case, hidden: true}
  - {name: test_integration, file: tests/test_integration.py, category: integration, hidden: true}
benchmarks:
  - name: 20k_random
    setup: |
      import random
      rng = random.Random(42)
      pts = [rng.randrange(0, 1_000_000) for _ in range(20_000)]
      args = ([(p, p + rng.randrange(0, 60)) for p in pts],)
    repeat: 7
    time_budget_ms: 50
  - name: 5k_nested
    setup: |
      args = ([(i, 10_000 - i) for i in range(5_000)],)
    repeat: 7
